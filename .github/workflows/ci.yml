name: SAC host conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: assetparity-labs/assetparity-classic-adapter
          path: assetparity-classic-adapter
      - uses: actions/checkout@v4
        with:
          repository: assetparity-labs/assetparity-sac-adapter
          path: assetparity-sac-adapter
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test assetparity-sac-adapter/test.mjs
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path assetparity-sac-adapter/Cargo.toml
